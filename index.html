<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600&display=swap">
<style>
/* Brand tokens sampled from the Mentra app screenshots:
   header blue #0062ff, deep navy #0d1c46 / #0f3280, chart sky #64b5f6, chart blue #1565c0,
   chart teal #246569, avatar orange #de7f11, logo neon cyan on navy */
:root{--bg:#08205f;--ink:#eef4ff;--mut:#a9c2f0;--brand:#0062ff;--brand2:#3d8bff;--sky:#64b5f6;--cyan:#4fd8ff;--orange:#de7f11;--navy:#0d1c46;--glass:rgba(8,30,105,.58);--line:rgba(100,181,246,.34);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#08205f}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);width:100%;overflow-x:hidden;overflow-x:clip;overscroll-behavior-x:none}
body{margin:0;max-width:100%;overflow-x:hidden;overflow-x:clip;background:var(--bg);color:var(--ink);font-family:'Readex Pro',Tahoma,Arial,sans-serif;line-height:1.7}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 50% at 12% 8%,rgba(0,98,255,.55),transparent 70%),radial-gradient(55% 50% at 92% 95%,rgba(100,181,246,.28),transparent 70%)}
canvas#w{position:fixed;inset:0;width:100%;height:100%;z-index:0}
nav{position:fixed;top:env(safe-area-inset-top,0px);inset-inline:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 5vw;background:linear-gradient(var(--bg),transparent)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:34px;height:34px;border-radius:22%;display:block;box-shadow:0 0 0 1px var(--line),0 0 18px rgba(79,216,255,.35)}
nav b{font-size:1.4rem;font-weight:600;letter-spacing:.04em}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.lang button{background:none;border:0;color:var(--mut);padding:6px 14px;font:inherit;cursor:pointer}
.lang button.on{background:var(--brand);color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
main{position:relative;z-index:2;overflow-x:hidden;overflow-x:clip}
section{overflow-x:hidden;overflow-x:clip;min-height:100vh;display:flex;align-items:center;padding:90px 5vw 50px}
.p{will-change:transform,opacity;transform-origin:50% 50%;width:min(100%,600px);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 18px 50px rgba(2,10,45,.45)}
section:nth-child(even){justify-content:flex-end}
h1{font-size:clamp(2rem,5.5vw,3.8rem);line-height:1.2;margin:0 0 12px;font-weight:600}
h2{font-size:clamp(1.5rem,3.4vw,2.3rem);margin:0 0 8px;font-weight:600}
p{margin:0 0 12px;color:#d6e4ff}small,.note{color:var(--mut);font-size:.85rem}
.note{border-inline-start:3px solid var(--orange);padding-inline-start:10px;margin-top:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1px solid var(--line);background:rgba(100,181,246,.1);border-radius:99px;padding:3px 12px;font-size:.85rem}
.optline{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px;color:#d6e4ff}
.optline .chip{flex:none;background:rgba(222,127,17,.18);border-color:rgba(222,127,17,.6);color:#ffd9a6;margin-top:3px}
.btn{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:0;border-radius:10px;padding:10px 20px;font:inherit;font-weight:600;cursor:pointer;box-shadow:0 6px 20px rgba(0,98,255,.45)}
.opt{display:block;width:100%;text-align:start;margin:6px 0;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer}
.opt.ok{border-color:#5fe08a;background:rgba(95,224,138,.15)}.opt.no{border-color:#e07a5f;background:rgba(224,122,95,.15)}
input[type=range]{width:100%;accent-color:var(--sky)}
.bars{display:flex;gap:8px;align-items:flex-end;height:110px;margin:10px 0}.bars i{flex:1;background:linear-gradient(var(--sky),#1565c0);border-radius:6px 6px 0 0;transition:height .6s}
input,textarea{width:100%;margin:5px 0;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:9px;font:inherit}
.err{color:#ff9a85;font-size:.85rem;min-height:1.2em}
.big{font-size:2rem;color:var(--cyan);font-weight:600}
#fok a{color:var(--cyan);word-break:break-all}

/* ---- image gallery: one fixed-size slot per section, however many images ---- */
.gal{margin:0 0 18px}
.gal-stage{position:relative;width:100%;aspect-ratio:11/5;border-radius:12px;overflow:hidden;background:rgba(4,14,50,.7);border:1px solid var(--line);box-shadow:0 8px 28px rgba(2,10,45,.5)}
.shot{position:absolute;inset:0;padding:0;border:0;background:none;cursor:zoom-in;opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
.shot.on{opacity:1;visibility:visible}
.shot img{width:100%;height:100%;object-fit:contain;display:block}
.zoom{position:absolute;inset-block-end:8px;inset-inline-end:8px;width:30px;height:30px;border-radius:8px;background:rgba(6,18,58,.78);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);pointer-events:none;opacity:.85}
.shot:hover .zoom,.shot:focus-visible .zoom{background:var(--brand);opacity:1}
.g-btn{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(6,18,58,.78);color:#fff;cursor:pointer;display:grid;place-items:center;padding:0;z-index:2}
.g-btn:hover{background:var(--brand)}
.g-prev{inset-inline-start:8px}.g-next{inset-inline-end:8px}
[dir=rtl] .g-btn svg,[dir=rtl] .lb-p svg,[dir=rtl] .lb-n svg{transform:scaleX(-1)}
.gal-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;font-size:.8rem;color:var(--mut)}
.gal-cap::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cyan);margin-inline-end:7px;box-shadow:0 0 8px var(--cyan)}
.dots{display:flex;gap:6px}.dots i{width:7px;height:7px;border-radius:50%;background:rgba(169,194,240,.4);cursor:pointer}.dots i.on{background:var(--cyan)}

/* ---- full-screen viewer ---- */
#lb{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(3,10,38,.95);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#lb[hidden]{display:none}
.lb-fig{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:96vw}
.lb-fig img{width:min(96vw,calc(84vh*2.2));height:auto;max-height:84vh;object-fit:contain;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6);background:#06123a}
.lb-cap{color:var(--mut);font-size:.9rem;text-align:center}
.lb-x,.lb-p,.lb-n{position:absolute;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(10,40,130,.8);color:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
.lb-x:hover,.lb-p:hover,.lb-n:hover{background:var(--brand)}
.lb-x{top:max(14px,env(safe-area-inset-top,0px));inset-inline-end:14px}
.lb-p,.lb-n{top:50%;transform:translateY(-50%)}
.lb-p{inset-inline-start:14px}.lb-n{inset-inline-end:14px}
.lb-p[hidden],.lb-n[hidden]{display:none}
/* ---- panels live inside the 3D scene (placed by the same camera as the WebGL corridor) ---- */
#stage{display:none;position:fixed;inset:0;z-index:2;overflow:hidden;pointer-events:none}
#cam{position:absolute;left:50%;top:50%;width:0;height:0;transform-origin:0 0;transform-style:preserve-3d;pointer-events:none}
.live #stage{display:block}
.live section{min-height:0;height:140vh;padding:0}
.live .p{position:absolute;left:0;top:0;transform-origin:50% 50%;width:min(600px,calc(100vw - 32px));-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(7,26,92,.86);backface-visibility:hidden;pointer-events:none;visibility:visible}
@media(max-width:700px){.p{padding:20px}section,section:nth-child(even){justify-content:center}.lb-p,.lb-n{top:auto;bottom:18px;transform:none}}
@media(prefers-reduced-motion:reduce){.bars i,.shot{transition:none}}
</style>
</head>

let cur=0,mx=0,my=0;addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
function size(){R.setSize(innerWidth,innerHeight,false);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}
addEventListener('resize',size);size();
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;

const PK=0.0173; /* world units per CSS pixel */

const objMat=m=>{const e=m.elements;return 'translate(-50%,-50%)matrix3d('+[e[0],e[1],e[2],e[3],-e[4],-e[5],-e[6],-e[7],e[8],e[9],e[10],e[11],e[12],e[13],e[14],e[15]].map(eps).join(',')+')'};
document.documentElement.classList.add('live');
const stage=document.createElement('div');stage.id='stage';const camEl=document.createElement('div');camEl.id='cam';stage.appendChild(camEl);document.body.appendChild(stage);
const pans=[...document.querySelectorAll('main section')].map((s,i)=>{const p=s.querySelector('.p');camEl.appendChild(p);

function panels(){
